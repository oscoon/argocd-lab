# PostSync hook: runs after everything is synced and healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: busybox:1.36
          command: ["sh", "-c", "wget -qO- http://shop/healthz && echo ' smoke test passed'"]
