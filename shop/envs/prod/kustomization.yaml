apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.14.0"
replicas:
  - name: shop
    count: 2
patches:
  - target: { kind: ConfigMap, name: shop-config }
    patch: |
      - op: replace
        path: /data/PODINFO_UI_MESSAGE
        value: "Shop (prod)"
      - op: replace
        path: /data/PODINFO_UI_COLOR
        value: "#7c3434"
  - target: { kind: Ingress, name: shop }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: shop-prod.localtest.me
