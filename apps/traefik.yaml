# A Helm chart from a chart repository, with values kept in git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.0
    helm:
      valuesObject:
        service:
          spec:
            type: NodePort
        ports:
          web:
            nodePort: 30080
        ingressClass:
          enabled: true
          isDefaultClass: true
        deployment:
          replicas: 1
        # Argo CD only calls an Ingress Healthy once its status has an address.
        # Traefik normally copies that from its Service, but a NodePort Service
        # has none on kind, so publish 127.0.0.1 (where port 80 lands) instead.
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
